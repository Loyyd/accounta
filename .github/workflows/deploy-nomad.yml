name: Deploy Nomad

on:
  workflow_run:
    workflows:
      - Docker Image
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-nomad-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/loyyd/accounta
  NOMAD_ADDR: http://100.64.0.5:4646
  NOMAD_SKIP_VERIFY: "true"
  NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}
  DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy-nomad:
    name: Deploy to Nomad
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image digest
        id: image
        shell: bash
        run: |
          set -euo pipefail

          short_sha="${DEPLOY_SHA::7}"
          image_tag="${IMAGE_NAME}:${short_sha}"

          for attempt in {1..30}; do
            digest="$(
              docker buildx imagetools inspect "${image_tag}" --format '{{json .Manifest}}' 2>/dev/null \
                | jq -r '.digest // empty'
            )"

            if [[ "${digest}" == sha256:* ]]; then
              echo "image=${image_tag}@${digest}" >> "${GITHUB_OUTPUT}"
              echo "Resolved ${image_tag}@${digest}"
              exit 0
            fi

            echo "Image ${image_tag} is not visible yet; retrying..."
            sleep 10
          done

          echo "Timed out waiting for ${image_tag}" >&2
          exit 1

      - name: Join Headscale tailnet
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.HEADSCALE_AUTHKEY }}
          hostname: accounta-deploy-${{ github.run_id }}
          args: --login-server=https://headscale.bcgen.ie --accept-dns=true
          ping: 100.64.0.5

      - name: Plan Nomad deployment
        shell: bash
        run: |
          docker run --rm \
            --network host \
            -e "NOMAD_ADDR=${NOMAD_ADDR}" \
            -e "NOMAD_SKIP_VERIFY=${NOMAD_SKIP_VERIFY}" \
            -e "NOMAD_TOKEN=${NOMAD_TOKEN}" \
            -v "${PWD}:/workspace:ro" \
            -w /workspace \
            hashicorp/nomad:1.11.2 \
            job plan \
            -var="accounta_image=${{ steps.image.outputs.image }}" \
            deploy/nomad/accounta.nomad.hcl || true

      - name: Run Nomad deployment
        shell: bash
        run: |
          docker run --rm \
            --network host \
            -e "NOMAD_ADDR=${NOMAD_ADDR}" \
            -e "NOMAD_SKIP_VERIFY=${NOMAD_SKIP_VERIFY}" \
            -e "NOMAD_TOKEN=${NOMAD_TOKEN}" \
            -v "${PWD}:/workspace:ro" \
            -w /workspace \
            hashicorp/nomad:1.11.2 \
            job run \
            -var="accounta_image=${{ steps.image.outputs.image }}" \
            deploy/nomad/accounta.nomad.hcl

      - name: Verify deployed revision
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..36}; do
            revision="$(curl -fsSL https://accounta.bcgen.ie/api/version | jq -r '.revision // empty' || true)"

            if [[ "${revision}" == "${DEPLOY_SHA}" ]]; then
              echo "Verified deployed revision ${revision}"
              exit 0
            fi

            echo "Production reports ${revision:-unknown}; waiting for ${DEPLOY_SHA}..."
            sleep 5
          done

          echo "Could not verify deployed revision ${DEPLOY_SHA}" >&2
          exit 1
