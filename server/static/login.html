<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login - accounta</title>
    <link rel="icon" type="image/png" href="accounta.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app login-container app-narrow">
      <header class="header page-header">
        <div class="brand-block">
          <a href="index.html" class="brand-link"><img src="accounta.png" alt="accounta" class="brand-logo brand-logo-lg" /></a>
          <h1>accounta</h1>
        </div>
        <p class="lead">Sign in to access your financial dashboard.</p>
      </header>

      <section class="card input-card login-card">
        <div id="messages"></div>
        <div id="googleLoginRow" class="google-auth-row" style="display:none;">
          <div class="google-login-surface" aria-hidden="true">
            <img src="google-logo.webp" alt="" class="google-mark" />
            <span>Continue with Google</span>
          </div>
          <div id="googleLoginButton"></div>
        </div>
        <div id="googleDisabledMessage" class="helper-text" style="display:none;"></div>
      </section>

    </main>

    <script src="shared.js"></script>
    <script src="login.js"></script>
  </body>
</html>
